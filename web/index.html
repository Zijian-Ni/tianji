<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="description" content="天机传统历算工具。离线查询八字四柱、北京时间交节时刻、六爻卦象与紫微十二宫。">
  <title>天机 · 八字排盘</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='2' y='2' width='60' height='60' rx='10' fill='%238e4231'/%3E%3Ctext x='32' y='47' text-anchor='middle' font-size='43' fill='%23fff0ce'%3E天%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css?v=0.4.0">
</head>
<body>
  <a class="skip" href="#workspace" data-i18n="skip">跳到排盘</a>
  <header class="topbar">
    <div class="shell toolbar">
      <div class="brand" aria-label="天机 Tianji"><span class="seal" aria-hidden="true">天</span><span class="wordmark">天机 <small>TIANJI</small></span></div>
      <div class="actions">
        <button id="lang-toggle" type="button" aria-label="Switch to English" lang="en">EN</button>
        <button id="theme-toggle" type="button"><span aria-hidden="true">◐</span> <span id="theme-label"></span></button>
        <button id="share-btn" type="button" class="primary" data-i18n="shareChart">分享排盘</button>
      </div>
    </div>
  </header>
  <main class="shell">
    <section class="masthead" aria-labelledby="panel-title">
      <div class="mast-copy">
        <p class="today"><span data-i18n="today">今日</span><span class="rule"></span><span id="today-date"></span></p>
        <h1 id="panel-title">八字排盘</h1>
        <p id="panel-description">输入公历出生时间，查看四柱、五行与交节时刻。</p>
      </div>
    </section>
    <nav class="tabs" role="tablist" aria-label="排盘方式" data-aria="methods">
      <button id="tab-bazi" role="tab" aria-selected="true" aria-controls="panel-bazi" data-tab="bazi"><b aria-hidden="true">☷</b><span data-i18n="tabBazi">八字排盘</span></button>
      <button id="tab-liuyao" role="tab" aria-selected="false" tabindex="-1" aria-controls="panel-liuyao" data-tab="liuyao"><b aria-hidden="true">䷾</b><span data-i18n="tabLiuyao">六爻占卜</span></button>
      <button id="tab-ziwei" role="tab" aria-selected="false" tabindex="-1" aria-controls="panel-ziwei" data-tab="ziwei"><b aria-hidden="true">✧</b><span data-i18n="tabZiwei">紫微斗数</span></button>
    </nav>
    <div id="workspace" tabindex="-1">
      <section id="panel-bazi" class="workspace" role="tabpanel" aria-labelledby="tab-bazi">
        <aside>
          <form id="bazi-form" class="card form-card">
            <h2 data-i18n="birthDetails">生辰资料</h2>
            <div class="fields">
              <label><span data-i18n="solarDate">公历日期</span><input id="bazi-date" type="date" min="1900-01-31" max="2100-12-31" value="1990-05-15" required></label>
              <label><span data-i18n="birthClock">出生时间</span><input id="bazi-time" type="time" value="14:30" required></label>
              <fieldset class="wide"><legend data-i18n="gender">性别</legend><div class="choices">
                <label><input type="radio" name="bazi-gender" value="male" checked><span data-i18n="male">男</span></label>
                <label><input type="radio" name="bazi-gender" value="female"><span data-i18n="female">女</span></label>
              </div></fieldset>
            </div>
            <p class="hint" data-i18n="clockRule">北京时间 UTC+8，零点换日。性别用于确定大运顺逆。</p>
            <div class="form-actions"><button type="button" id="example-btn" data-i18n="boundaryExample">立春交节示例</button><button type="button" id="now-btn" data-i18n="useNow">用此刻</button></div>
          </form>
          <div class="card terms" id="term-card" hidden><h2 data-i18n="termBasis">交节依据</h2><div id="term-window"></div></div>
        </aside>
        <div id="bazi-result" class="result" aria-live="polite"></div>
      </section>
      <section id="panel-liuyao" class="workspace" role="tabpanel" aria-labelledby="tab-liuyao" hidden>
        <aside>
          <form id="liuyao-form" class="card form-card">
            <h2 data-i18n="castMethod">起卦方法</h2>
            <label class="field"><span data-i18n="method">方式</span><select id="liuyao-method">
              <option value="time" data-i18n="timeCast">时间起卦</option><option value="number" data-i18n="numberCast">数字起卦</option><option value="coin" data-i18n="coinCast">铜钱摇卦</option>
            </select></label>
            <div id="liuyao-time-inputs"><label class="field"><span data-i18n="castTime">起卦时间（UTC+8）</span><input id="cast-time" type="datetime-local" min="1900-01-31T00:00" max="2100-12-31T23:59" required></label></div>
            <div id="liuyao-number-inputs" class="fields" hidden>
              <label><span data-i18n="num1Label">数字一</span><input id="liuyao-num1" type="number" min="1" max="999" value="3" required></label>
              <label><span data-i18n="num2Label">数字二</span><input id="liuyao-num2" type="number" min="1" max="999" value="7" required></label>
              <label class="wide"><span data-i18n="num3Label">数字三（可选）</span><input id="liuyao-num3" type="number" min="1" max="999"></label>
            </div>
            <p id="cast-hint" class="hint"></p>
            <button id="liuyao-cast-btn" class="primary full" type="submit" data-i18n="castNow">起卦</button>
          </form>
        </aside>
        <div id="liuyao-result" class="result" aria-live="polite"></div>
      </section>
      <section id="panel-ziwei" class="workspace" role="tabpanel" aria-labelledby="tab-ziwei" hidden>
        <aside>
          <form id="ziwei-form" class="card form-card">
            <h2 data-i18n="lunarBirth">农历生辰</h2>
            <div class="fields">
              <label><span data-i18n="lunarYear">年</span><input id="ziwei-year" type="number" min="1900" max="2100" value="1990" required></label>
              <label><span data-i18n="lunarMonth">月</span><select id="ziwei-month"></select></label>
              <label><span data-i18n="lunarDay">日</span><input id="ziwei-day" type="number" min="1" max="30" value="21" required></label>
              <label><span data-i18n="birthTime">出生时辰</span><select id="ziwei-hour"></select></label>
              <fieldset class="wide"><legend data-i18n="gender">性别</legend><div class="choices">
                <label><input type="radio" name="ziwei-gender" value="male" checked><span data-i18n="male">男</span></label>
                <label><input type="radio" name="ziwei-gender" value="female"><span data-i18n="female">女</span></label>
              </div></fieldset>
            </div>
            <p class="hint" data-i18n="ziweiRule">采用农历生辰，闰月按本月安宫。</p>
            <button type="button" id="use-bazi" data-i18n="useBazi">从八字生辰换算</button>
          </form>
        </aside>
        <div id="ziwei-result" class="result" aria-live="polite"></div>
      </section>
    </div>
  </main>
  <footer class="shell footer"><span>天机 · Tianji</span><span data-i18n="offline">本地计算 · 离线可用</span><a href="https://github.com/Zijian-Ni/tianji">GitHub</a></footer>
  <dialog id="share-modal" aria-labelledby="share-heading">
    <h2 id="share-heading" data-i18n="shareChart">分享排盘</h2>
    <p class="hint" data-i18n="shareDetail">链接包含当前排盘资料，持有链接的人可以还原这张盘。</p>
    <label class="field"><span data-i18n="chartLink">排盘链接</span><input id="share-url" type="text" readonly></label>
    <div class="form-actions"><button id="copy-url-btn" class="primary" type="button" data-i18n="copyLink">复制链接</button><button id="close-share" type="button" data-i18n="close">关闭</button></div>
    <p id="copy-status" role="status"></p>
  </dialog>
  <script src="js/almanac.js?v=0.4.0"></script>
  <script src="js/calendar.js?v=0.4.0"></script>
  <script src="js/bazi.js?v=0.4.0"></script>
  <script src="js/liuyao.js?v=0.4.0"></script>
  <script src="js/ziwei.js?v=0.4.0"></script>
  <script src="js/i18n.js?v=0.4.0"></script>
  <script src="js/views.js?v=0.4.0"></script>
  <script src="js/app.js?v=0.4.0"></script>
</body>
</html>
